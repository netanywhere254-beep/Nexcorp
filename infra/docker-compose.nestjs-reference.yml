# NestJS + PostgreSQL + Redis reference stack for NexISP.
# This is NOT the active Laravel + MySQL deployment configuration.
# Run from the repository root with:
# docker compose --env-file infra/.env.nexisp -f infra/docker-compose.nestjs-reference.yml up -d --build

name: nexisp-nestjs-reference

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in infra/.env.nexisp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env.nexisp}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in infra/.env.nexisp}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$\{POSTGRES_USER}\" -d \"$$\{POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - nexisp

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/.env.nexisp}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - nexisp

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/.env.nexisp}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in infra/.env.nexisp}
    ports:
      # Keep the API on localhost; put a TLS reverse proxy in front for remote access.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - nexisp

volumes:
  pgdata:
  redisdata:

networks:
  nexisp:
    driver: bridge
