# BACKUP: separate Next.js web + Express API + PostgreSQL stack.
# This is a standby alternative, not a live replica of the primary system.
# Run from the repository root using infra/.env.backup.
name: nexora-backup

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexora_backup}
      POSTGRES_USER: ${POSTGRES_USER:-nexora_backup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env.backup}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - nexora_backup_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backup_private

  api:
    build:
      context: ../backup/node-postgres/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-nexora_backup}
      DB_USER: ${POSTGRES_USER:-nexora_backup}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env.backup}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3100}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4100}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backup_private

  web:
    build:
      context: ../backup/node-postgres/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4100}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4100}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backup_private

volumes:
  nexora_backup_postgres:

networks:
  backup_private:
    driver: bridge
