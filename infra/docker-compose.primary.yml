# PRIMARY: Laravel modular monolith + MySQL.
# Run from the repository root using infra/.env.primary.
name: nexora-primary

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in infra/.env.primary}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexora_primary}
      MYSQL_USER: ${MYSQL_USER:-nexora_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in infra/.env.primary}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - nexora_primary_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - primary_private

  app:
    build:
      context: ../backend/laravel
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Nexora}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TIMEZONE: Africa/Nairobi
      APP_KEY: ${APP_KEY:-}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-nexora_primary}
      DB_USERNAME: ${MYSQL_USER:-nexora_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in infra/.env.primary}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      APPROVAL_SMS_URL: ${APPROVAL_SMS_URL:-}
      APPROVAL_SMS_TOKEN: ${APPROVAL_SMS_TOKEN:-}
      APPROVAL_SMS_SENDER_ID: ${APPROVAL_SMS_SENDER_ID:-NEXORA}
      APPROVAL_OTP_TTL_MINUTES: ${APPROVAL_OTP_TTL_MINUTES:-5}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Nexora Group}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - primary_private

volumes:
  nexora_primary_mysql:

networks:
  primary_private:
    driver: bridge
