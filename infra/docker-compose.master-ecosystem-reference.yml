# Single-backend / Next.js / PostgreSQL proposal.
# This is a reference only, not the active Laravel + MySQL architecture.
# Run from the repository root after creating the referenced Dockerfiles:
# docker compose --env-file infra/.env.master-ecosystem -f infra/docker-compose.master-ecosystem-reference.yml up -d --build

name: master-ecosystem-reference

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-master_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env.master-ecosystem}
      POSTGRES_DB: ${POSTGRES_DB:-master_ecosystem}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - master_ecosystem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app_private

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in infra/.env.master-ecosystem}
      PORT: "4000"
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app_private

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
      args:
        # Next.js NEXT_PUBLIC_* values are normally embedded at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - app_private

volumes:
  master_ecosystem_pgdata:

networks:
  app_private:
    driver: bridge
