name: NetPulse Firmware Triage CI

on:
  push:
    branches:
      - feature/netpulse-cpe-os-foundation
    paths:
      - "cpe/security/**"
      - ".github/workflows/netpulse-firmware-triage.yml"
  pull_request:
    paths:
      - "cpe/security/**"
      - ".github/workflows/netpulse-firmware-triage.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile security tools
        working-directory: cpe/security
        run: python -m py_compile firmware_triage.py test_firmware_triage.py
      - name: Run unit tests
        working-directory: cpe/security
        run: python -m unittest -v
